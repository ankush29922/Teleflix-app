name: Bug report
description: Report a problem in Teleflix
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve Teleflix. Never include login codes, passwords, API hashes, phone numbers or private channel content."
  - type: input
    id: version
    attributes:
      label: Teleflix version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
      placeholder: "Phone model, Android version"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Video player
        - Channels or stacks
        - Watch Later
        - Storage or cache
        - Account sign-in or switching
        - Interface or display
        - Something else
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened and how can we reproduce it?
      description: Describe your steps and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or extra details
      description: Optional. Remove private information before attaching anything.
